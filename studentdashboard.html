<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F.L.A.S.H. - SHS Student Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        :root {
            --brand: #3D5AFE;
            --brand-hover: #3249cf;
            --ink: #0B1120;
            --ink-2: #1E293B;
            --paper: #F8FAFC;
            --card: #FFFFFF;
            --text-main: #334155;
            --text-muted: #64748B;
            --danger: #EF4444;
            --success: #10B981;
            --warning: #F59E0B;
            --border: #E2E8F0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--paper);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, h5, h6, .brand-font {
            font-family: 'Space Grotesk', sans-serif;
        }

        /* Utility classes utilizing CSS Variables */
        .bg-ink { background-color: var(--ink); }
        .bg-ink-2 { background-color: var(--ink-2); }
        .bg-paper { background-color: var(--paper); }
        .bg-card { background-color: var(--card); }
        .bg-brand { background-color: var(--brand); }
        .text-brand { color: var(--brand); }
        .hover-bg-brand:hover { background-color: var(--brand-hover); }
        .text-ink { color: var(--ink); }
        
        .border-custom { border-color: var(--border); }
        .card-shadow { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); }

        /* Chart Animations */
        .bar-chart-fill {
            transition: height 1s ease-out;
        }

        /* Modal Transitions */
        .modal-enter { opacity: 0; transform: scale(0.95); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: opacity 200ms, transform 200ms; }
    </style>
</head>
<body class="antialiased h-screen flex flex-col md:flex-row overflow-hidden">

    <div id="app-container" class="flex h-full w-full">

        <!-- Sidebar -->
        <aside class="w-64 bg-ink text-white flex flex-col h-full flex-shrink-0 transition-transform duration-300">
            <div class="p-6 flex items-center gap-3">
                <i class="ph-fill ph-lightning text-brand text-2xl"></i>
                <span class="text-xl font-bold brand-font tracking-wide">F.L.A.S.H.</span>
            </div>

            <div class="px-6 py-2">
                <div class="text-xs uppercase text-gray-400 font-semibold tracking-wider mb-2">Navigation</div>
                <nav id="sidebar-nav" class="space-y-1">
                    <!-- Dynamic links injected here -->
                </nav>
            </div>

            <div class="mt-auto p-6 bg-ink-2 flex items-center justify-between">
                <div class="flex items-center gap-3 overflow-hidden">
                    <div class="w-8 h-8 rounded-full bg-brand flex items-center justify-center text-sm font-bold flex-shrink-0" id="user-initial">U</div>
                    <div class="truncate">
                        <div class="text-sm font-medium truncate" id="display-name">User Name</div>
                        <div class="text-xs text-gray-400" id="display-role">Role</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col h-full overflow-hidden bg-paper">
            <header class="bg-card border-b border-custom px-8 py-4 flex items-center justify-between flex-shrink-0">
                <h2 class="text-xl font-semibold brand-font text-ink capitalize" id="current-view-title">Dashboard</h2>
                <div class="flex items-center gap-4">
                    <div class="hidden md:flex items-center gap-2 text-sm text-text-muted bg-paper px-3 py-1.5 rounded-full border border-custom">
                        <i class="ph ph-clock"></i>
                        <span id="current-time">00:00 AM</span>
                    </div>
                </div>
            </header>

            <div id="view-container" class="flex-1 overflow-y-auto p-8 relative">
                <!-- Content injected here via JS -->
            </div>
        </main>
    </div>

    <!-- Global Modal Overlay -->
    <div id="global-modal" class="fixed inset-0 bg-ink/50 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div id="modal-content" class="bg-card w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden border border-custom">
            <!-- Modal inner content injected here -->
        </div>
    </div>

    <script>
        // Fixed user for this dashboard (no login page)
        const currentUser = { name: 'Juan Dela Cruz', role: 'SHS Student' };
        let activeTimer = null;
        let mockRosterInterval = null;

        const navLinks = [
                { id: 'home', label: 'Dashboard', icon: 'ph-squares-four' },
                { id: 'scan', label: 'Scan QR / ID', icon: 'ph-qr-code' },
                { id: 'schedule', label: 'My Schedule', icon: 'ph-calendar-blank' },
                { id: 'history', label: 'Attendance History', icon: 'ph-clock-counter-clockwise' }
            ];

        // DOM Elements
        const sidebarNav = document.getElementById('sidebar-nav');
        const viewContainer = document.getElementById('view-container');
        const currentViewTitle = document.getElementById('current-view-title');
        const globalModal = document.getElementById('global-modal');
        const modalContent = document.getElementById('modal-content');

        // Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('current-time').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }
        updateClock();
        setInterval(updateClock, 1000);

        // Profile block
        document.getElementById('display-name').innerText = currentUser.name;
        document.getElementById('display-role').innerText = currentUser.role;
        document.getElementById('user-initial').innerText = currentUser.name.replace(/^(Prof\.|Dir\.)\s*/, '').charAt(0).toUpperCase();

        function renderSidebar() {
            sidebarNav.innerHTML = navLinks.map(link => `
                <button onclick="switchView('${link.id}')" id="nav-${link.id}" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors text-gray-400 hover:text-white hover:bg-ink-2">
                    <i class="ph ${link.icon} text-lg"></i>
                    ${link.label}
                </button>
            `).join('');
        }

        function switchView(viewId) {
            const links = sidebarNav.querySelectorAll('button');
            links.forEach(l => {
                l.classList.remove('bg-brand', 'text-white');
                l.classList.add('text-gray-400');
            });
            const activeLink = document.getElementById(`nav-${viewId}`);
            if (activeLink) {
                activeLink.classList.remove('text-gray-400', 'hover:bg-ink-2');
                activeLink.classList.add('bg-brand', 'text-white');
                currentViewTitle.innerText = activeLink.innerText.trim();
            }

            clearTimers();
            viewContainer.innerHTML = '';
            renderView(viewId);
        }

        function clearTimers() {
            if(activeTimer) clearInterval(activeTimer);
            if(mockRosterInterval) clearInterval(mockRosterInterval);
        }

        function showModal(contentHTML) {
            modalContent.innerHTML = contentHTML;
            globalModal.classList.remove('hidden');
            globalModal.classList.add('flex');
        }

        function closeModal() {
            globalModal.classList.add('hidden');
            globalModal.classList.remove('flex');
        }

        function renderView(viewId) {
            let html = '';
            if (viewId === 'home') {
                html = `
                    <div class="mb-6">
                        <h3 class="text-2xl font-bold text-ink brand-font mb-1">Welcome back, ${currentUser.name.split(' ')[0]}!</h3>
                        <p class="text-text-muted">Here is your attendance overview for this semester.</p>
                    </div>
                    
                    <!-- Threshold Warning Alert based on ERD logic -->
                    <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded-r-lg mb-8 shadow-sm">
                        <div class="flex items-start gap-3">
                            <i class="ph-fill ph-warning-circle text-red-500 text-xl mt-0.5"></i>
                            <div>
                                <h4 class="text-red-800 font-semibold text-sm">Absence Threshold Alert</h4>
                                <p class="text-red-700 text-sm mt-1">You have reached 3/4 allowed absences for <strong>CS101 - Data Structures</strong>. One more absence will result in an automatic drop warning.</p>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-card p-6 rounded-xl border border-custom card-shadow">
                            <div class="text-text-muted text-sm font-medium mb-2">Total Classes</div>
                            <div class="text-3xl font-bold text-ink">42</div>
                        </div>
                        <div class="bg-card p-6 rounded-xl border border-custom card-shadow">
                            <div class="text-text-muted text-sm font-medium mb-2">Present</div>
                            <div class="text-3xl font-bold text-success">38</div>
                        </div>
                        <div class="bg-card p-6 rounded-xl border border-custom card-shadow">
                            <div class="text-text-muted text-sm font-medium mb-2">Absences</div>
                            <div class="text-3xl font-bold text-danger">4</div>
                        </div>
                    </div>
                `;
            } else if (viewId === 'scan') {
                html = `
                    <div class="max-w-2xl mx-auto bg-card rounded-2xl border border-custom card-shadow overflow-hidden">
                        <div class="p-6 border-b border-custom bg-paper flex justify-between items-center">
                            <h3 class="font-bold text-ink brand-font text-lg">Check-In Interface</h3>
                            <div class="flex items-center gap-2 bg-gray-200 p-1 rounded-lg">
                                <button onclick="setScanMode('mobile')" id="btn-mode-mobile" class="px-3 py-1.5 text-sm font-medium rounded-md bg-white shadow-sm transition-all">Mobile App</button>
                                <button onclick="setScanMode('webcam')" id="btn-mode-webcam" class="px-3 py-1.5 text-sm font-medium rounded-md text-gray-500 hover:text-ink transition-all">Webcam (ID)</button>
                            </div>
                        </div>
                        <div class="p-8 flex flex-col items-center">
                            <div class="w-64 h-64 bg-gray-100 border-2 border-dashed border-gray-300 rounded-xl mb-6 flex flex-col items-center justify-center relative overflow-hidden" id="scanner-viewport">
                                <i class="ph ph-camera text-4xl text-gray-400 mb-2"></i>
                                <span class="text-sm text-gray-500" id="scanner-instruction">Ready to scan QR</span>
                                <div class="absolute inset-0 bg-blue-500/10 border-blue-500 border-2 hidden" id="scan-frame"></div>
                            </div>
                            
                            <div id="scan-status" class="w-full text-center min-h-[4rem]">
                                <!-- Status updates injected here -->
                            </div>

                            <button onclick="simulateStudentScan()" class="mt-4 bg-brand hover-bg-brand text-white px-6 py-2.5 rounded-lg font-medium transition-colors flex items-center gap-2">
                                <i class="ph ph-scan"></i> Simulate Scan Process
                            </button>
                        </div>
                    </div>
                `;
            } else if (viewId === 'schedule') {
                html = `
                    <div class="bg-card rounded-xl border border-custom card-shadow overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-paper border-b border-custom">
                                    <th class="py-3 px-6 text-sm font-semibold text-text-muted">Time</th>
                                    <th class="py-3 px-6 text-sm font-semibold text-text-muted">Course</th>
                                    <th class="py-3 px-6 text-sm font-semibold text-text-muted">Room</th>
                                    <th class="py-3 px-6 text-sm font-semibold text-text-muted">Instructor</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr class="border-b border-custom">
                                    <td class="py-4 px-6 text-sm text-ink font-medium">08:00 AM - 09:30 AM</td>
                                    <td class="py-4 px-6 text-sm font-semibold brand-font text-brand">CS101 - Data Structures</td>
                                    <td class="py-4 px-6 text-sm text-text-main">Room 304</td>
                                    <td class="py-4 px-6 text-sm text-text-main">Dr. Smith</td>
                                </tr>
                                <tr class="border-b border-custom">
                                    <td class="py-4 px-6 text-sm text-ink font-medium">10:00 AM - 11:30 AM</td>
                                    <td class="py-4 px-6 text-sm font-semibold brand-font text-brand">ENG201 - Literature</td>
                                    <td class="py-4 px-6 text-sm text-text-main">Online</td>
                                    <td class="py-4 px-6 text-sm text-text-main">Prof. Allen</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                `;
            } else if (viewId === 'history') {
                html = `
                     <div class="bg-card rounded-xl border border-custom card-shadow overflow-hidden">
                        <div class="p-5 border-b border-custom flex justify-between items-center bg-paper">
                            <h3 class="font-bold text-ink brand-font">Recent Logs</h3>
                            <button class="text-sm text-brand font-medium">Filter</button>
                        </div>
                        <ul class="divide-y divide-custom">
                            <li class="p-5 flex items-center justify-between">
                                <div>
                                    <div class="font-semibold text-ink text-sm">CS101 - Data Structures</div>
                                    <div class="text-xs text-text-muted mt-1">Sept 28, 2026 • 08:02 AM</div>
                                </div>
                                <span class="px-3 py-1 text-xs font-medium bg-green-100 text-green-700 rounded-full flex items-center gap-1">
                                    <i class="ph-fill ph-map-pin"></i> Onsite (APC)
                                </span>
                            </li>
                            <li class="p-5 flex items-center justify-between">
                                <div>
                                    <div class="font-semibold text-ink text-sm">ENG201 - Literature</div>
                                    <div class="text-xs text-text-muted mt-1">Sept 27, 2026 • 10:01 AM</div>
                                </div>
                                <span class="px-3 py-1 text-xs font-medium bg-blue-100 text-blue-700 rounded-full flex items-center gap-1">
                                    <i class="ph-fill ph-globe"></i> Online
                                </span>
                            </li>s
                            <li class="p-5 flex items-center justify-between">
                                <div>
                                    <div class="font-semibold text-ink text-sm">MATH104 - Calculus</div>
                                    <div class="text-xs text-text-muted mt-1">Sept 26, 2026 • 01:15 PM</div>
                                </div>
                                <span class="px-3 py-1 text-xs font-medium bg-red-100 text-red-700 rounded-full">
                                    Late
                                </span>
                            </li>
                        </ul>
                    </div>
                `;
            }
            viewContainer.innerHTML = html;
        }

        // Student Scan Interactive Logic
        window.setScanMode = function(mode) {
            const btnMobile = document.getElementById('btn-mode-mobile');
            const btnWebcam = document.getElementById('btn-mode-webcam');
            const instruction = document.getElementById('scanner-instruction');
            
            if(mode === 'mobile') {
                btnMobile.className = 'px-3 py-1.5 text-sm font-medium rounded-md bg-white shadow-sm transition-all text-ink';
                btnWebcam.className = 'px-3 py-1.5 text-sm font-medium rounded-md text-gray-500 hover:text-ink transition-all';
                instruction.innerText = 'Ready to scan QR Code';
            } else {
                btnWebcam.className = 'px-3 py-1.5 text-sm font-medium rounded-md bg-white shadow-sm transition-all text-ink';
                btnMobile.className = 'px-3 py-1.5 text-sm font-medium rounded-md text-gray-500 hover:text-ink transition-all';
                instruction.innerText = 'Show Physical ID to Webcam';
            }
        };

        window.simulateStudentScan = function() {
            const statusBox = document.getElementById('scan-status');
            const frame = document.getElementById('scan-frame');
            
            statusBox.innerHTML = `<div class="text-brand font-medium flex items-center justify-center gap-2 animate-pulse"><i class="ph ph-spinner animate-spin"></i> Scanning...</div>`;
            frame.classList.remove('hidden');

            setTimeout(() => {
                statusBox.innerHTML = `<div class="text-warning font-medium flex items-center justify-center gap-2 animate-pulse"><i class="ph ph-map-pin"></i> Validating Geolocation...</div>`;
                
                setTimeout(() => {
                    frame.classList.add('hidden');
                    // Randomly assign Onsite or Online
                    const isOnsite = Math.random() > 0.5;
                    if(isOnsite) {
                        statusBox.innerHTML = `
                            <div class="text-success font-semibold text-lg flex items-center justify-center gap-2">
                                <i class="ph-fill ph-check-circle"></i> Check-in Successful
                            </div>
                            <p class="text-sm text-text-muted mt-1">Tagged as: <span class="font-bold text-ink">Onsite (APC Geofence Verified)</span></p>
                        `;
                    } else {
                        statusBox.innerHTML = `
                            <div class="text-success font-semibold text-lg flex items-center justify-center gap-2">
                                <i class="ph-fill ph-check-circle"></i> Check-in Successful
                            </div>
                            <p class="text-sm text-text-muted mt-1">Tagged as: <span class="font-bold text-ink">Online (Outside Geofence)</span></p>
                        `;
                    }
                }, 2000);
            }, 1500);
        };

        // Initialize inline keyframes for UI animations
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
        `;
        document.head.appendChild(style);

        // Boot
        renderSidebar();
        switchView('home');

    </script>
</body>
</html>
