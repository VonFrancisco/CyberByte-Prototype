<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F.L.A.S.H. - SHS Director Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        :root {
            --brand: #3D5AFE;
            --brand-hover: #3249cf;
            --ink: #0B1120;
            --ink-2: #1E293B;
            --paper: #F8FAFC;
            --card: #FFFFFF;
            --text-main: #334155;
            --text-muted: #64748B;
            --danger: #EF4444;
            --success: #10B981;
            --warning: #F59E0B;
            --border: #E2E8F0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--paper);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, h5, h6, .brand-font {
            font-family: 'Space Grotesk', sans-serif;
        }

        /* Utility classes utilizing CSS Variables */
        .bg-ink { background-color: var(--ink); }
        .bg-ink-2 { background-color: var(--ink-2); }
        .bg-paper { background-color: var(--paper); }
        .bg-card { background-color: var(--card); }
        .bg-brand { background-color: var(--brand); }
        .text-brand { color: var(--brand); }
        .hover-bg-brand:hover { background-color: var(--brand-hover); }
        .text-ink { color: var(--ink); }
        
        .border-custom { border-color: var(--border); }
        .card-shadow { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); }

        /* Chart Animations */
        .bar-chart-fill {
            transition: height 1s ease-out;
        }

        /* Modal Transitions */
        .modal-enter { opacity: 0; transform: scale(0.95); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: opacity 200ms, transform 200ms; }
    </style>
</head>
<body class="antialiased h-screen flex flex-col md:flex-row overflow-hidden">

    <div id="app-container" class="flex h-full w-full">

        <!-- Sidebar -->
        <aside class="w-64 bg-ink text-white flex flex-col h-full flex-shrink-0 transition-transform duration-300">
            <div class="p-6 flex items-center gap-3">
                <i class="ph-fill ph-lightning text-brand text-2xl"></i>
                <span class="text-xl font-bold brand-font tracking-wide">F.L.A.S.H.</span>
            </div>

            <div class="px-6 py-2">
                <div class="text-xs uppercase text-gray-400 font-semibold tracking-wider mb-2">Navigation</div>
                <nav id="sidebar-nav" class="space-y-1">
                    <!-- Dynamic links injected here -->
                </nav>
            </div>

            <div class="mt-auto p-6 bg-ink-2 flex items-center justify-between">
                <div class="flex items-center gap-3 overflow-hidden">
                    <div class="w-8 h-8 rounded-full bg-brand flex items-center justify-center text-sm font-bold flex-shrink-0" id="user-initial">U</div>
                    <div class="truncate">
                        <div class="text-sm font-medium truncate" id="display-name">User Name</div>
                        <div class="text-xs text-gray-400" id="display-role">Role</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col h-full overflow-hidden bg-paper">
            <header class="bg-card border-b border-custom px-8 py-4 flex items-center justify-between flex-shrink-0">
                <h2 class="text-xl font-semibold brand-font text-ink capitalize" id="current-view-title">Dashboard</h2>
                <div class="flex items-center gap-4">
                    <div class="hidden md:flex items-center gap-2 text-sm text-text-muted bg-paper px-3 py-1.5 rounded-full border border-custom">
                        <i class="ph ph-clock"></i>
                        <span id="current-time">00:00 AM</span>
                    </div>
                </div>
            </header>

            <div id="view-container" class="flex-1 overflow-y-auto p-8 relative">
                <!-- Content injected here via JS -->
            </div>
        </main>
    </div>

    <!-- Global Modal Overlay -->
    <div id="global-modal" class="fixed inset-0 bg-ink/50 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div id="modal-content" class="bg-card w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden border border-custom">
            <!-- Modal inner content injected here -->
        </div>
    </div>

    <script>
        // Fixed user for this dashboard (no login page)
        const currentUser = { name: 'Dir. Ramon Reyes', role: 'SHS Director' };
        let activeTimer = null;
        let mockRosterInterval = null;

        const navLinks = [
                { id: 'home', label: 'Executive Portal', icon: 'ph-chart-pie-slice' },
                { id: 'insights', label: 'AI Insights', icon: 'ph-brain' },
                { id: 'reports', label: 'Export Reports', icon: 'ph-export' }
            ];

        // DOM Elements
        const sidebarNav = document.getElementById('sidebar-nav');
        const viewContainer = document.getElementById('view-container');
        const currentViewTitle = document.getElementById('current-view-title');
        const globalModal = document.getElementById('global-modal');
        const modalContent = document.getElementById('modal-content');

        // Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('current-time').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }
        updateClock();
        setInterval(updateClock, 1000);

        // Profile block
        document.getElementById('display-name').innerText = currentUser.name;
        document.getElementById('display-role').innerText = currentUser.role;
        document.getElementById('user-initial').innerText = currentUser.name.replace(/^(Prof\.|Dir\.)\s*/, '').charAt(0).toUpperCase();

        function renderSidebar() {
            sidebarNav.innerHTML = navLinks.map(link => `
                <button onclick="switchView('${link.id}')" id="nav-${link.id}" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors text-gray-400 hover:text-white hover:bg-ink-2">
                    <i class="ph ${link.icon} text-lg"></i>
                    ${link.label}
                </button>
            `).join('');
        }

        function switchView(viewId) {
            const links = sidebarNav.querySelectorAll('button');
            links.forEach(l => {
                l.classList.remove('bg-brand', 'text-white');
                l.classList.add('text-gray-400');
            });
            const activeLink = document.getElementById(`nav-${viewId}`);
            if (activeLink) {
                activeLink.classList.remove('text-gray-400', 'hover:bg-ink-2');
                activeLink.classList.add('bg-brand', 'text-white');
                currentViewTitle.innerText = activeLink.innerText.trim();
            }

            clearTimers();
            viewContainer.innerHTML = '';
            renderView(viewId);
        }

        function clearTimers() {
            if(activeTimer) clearInterval(activeTimer);
            if(mockRosterInterval) clearInterval(mockRosterInterval);
        }

        function showModal(contentHTML) {
            modalContent.innerHTML = contentHTML;
            globalModal.classList.remove('hidden');
            globalModal.classList.add('flex');
        }

        function closeModal() {
            globalModal.classList.add('hidden');
            globalModal.classList.remove('flex');
        }

        function renderView(viewId) {
            let html = '';
            if (viewId === 'home') {
                html = `
                    <div class="flex justify-between items-center mb-8">
                        <div>
                            <h3 class="text-2xl font-bold text-ink brand-font">Executive Portal</h3>
                            <p class="text-text-muted">School-wide attendance overview</p>
                        </div>
                        <select class="px-4 py-2 border border-custom rounded-lg bg-white text-sm font-medium focus:ring-2 focus:ring-brand">
                            <option>Midterm 2026-2027</option>
                            <option>Finals 2026-2027</option>
                        </select>
                    </div>

                    <!-- KPI Cards -->
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                        <div class="bg-card p-5 rounded-xl border border-custom card-shadow">
                            <div class="text-text-muted text-xs uppercase font-bold tracking-wider mb-2">Overall Attendance</div>
                            <div class="text-3xl font-bold text-ink">94.2%</div>
                            <div class="text-xs text-success mt-2 flex items-center"><i class="ph-bold ph-trend-up mr-1"></i> +1.2% from last term</div>
                        </div>
                        <div class="bg-card p-5 rounded-xl border border-custom card-shadow">
                            <div class="text-text-muted text-xs uppercase font-bold tracking-wider mb-2">Tardiness Rate</div>
                            <div class="text-3xl font-bold text-warning">8.5%</div>
                            <div class="text-xs text-danger mt-2 flex items-center"><i class="ph-bold ph-trend-up mr-1"></i> +0.5% this week</div>
                        </div>
                        <div class="bg-card p-5 rounded-xl border border-custom card-shadow">
                            <div class="text-text-muted text-xs uppercase font-bold tracking-wider mb-2">At-Risk Students</div>
                            <div class="text-3xl font-bold text-danger">124</div>
                            <div class="text-xs text-text-muted mt-2">Nearing absence threshold</div>
                        </div>
                        <div class="bg-card p-5 rounded-xl border border-custom card-shadow">
                            <div class="text-text-muted text-xs uppercase font-bold tracking-wider mb-2">Active Sessions</div>
                            <div class="text-3xl font-bold text-brand">12</div>
                            <div class="text-xs text-text-muted mt-2">Currently ongoing classes</div>
                        </div>
                    </div>

                    <!-- Interactive Trend Graph (CSS Mock) -->
                    <div class="bg-card p-6 rounded-xl border border-custom card-shadow">
                        <h4 class="font-bold text-ink brand-font mb-6">Attendance Trends (Last 7 Days)</h4>
                        
                        <div class="h-64 w-full flex items-end justify-between px-2 gap-2 relative border-b border-custom pb-2">
                            <!-- Y-axis labels -->
                            <div class="absolute left-0 top-0 bottom-0 flex flex-col justify-between text-xs text-gray-400 py-2 -ml-6">
                                <span>100%</span>
                                <span>75%</span>
                                <span>50%</span>
                                <span>25%</span>
                            </div>
                            
                            <!-- Bars -->
                            <div class="w-full flex justify-around items-end h-full pt-4">
                                ${[85, 92, 88, 95, 90, 96, 91].map((val, i) => `
                                    <div class="flex flex-col items-center w-full group">
                                        <div class="w-3/4 max-w-[40px] bg-brand/20 rounded-t-sm relative flex items-end group-hover:bg-brand/30 transition-colors" style="height: 100%;">
                                            <div class="w-full bg-brand rounded-t-sm bar-chart-fill shadow-sm" style="height: 0%;" data-height="${val}%">
                                                <div class="opacity-0 group-hover:opacity-100 absolute -top-8 left-1/2 -translate-x-1/2 bg-ink text-white text-xs px-2 py-1 rounded transition-opacity pointer-events-none">${val}%</div>
                                            </div>
                                        </div>
                                        <span class="text-xs text-gray-500 mt-2 font-medium">Day ${i+1}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
                
                // Trigger CSS bar chart animation
                setTimeout(() => {
                    const bars = viewContainer.querySelectorAll('.bar-chart-fill');
                    bars.forEach(bar => {
                        bar.style.height = bar.getAttribute('data-height');
                    });
                }, 100);

            } else if (viewId === 'insights') {
                html = `
                    <h3 class="text-2xl font-bold text-ink brand-font mb-6 flex items-center gap-2">
                        <i class="ph-fill ph-magic-wand text-brand"></i> AI Engine Insights
                    </h3>
                    <div class="space-y-4">
                        <div class="bg-card p-6 rounded-xl border border-custom card-shadow flex items-start gap-4">
                            <div class="p-3 bg-red-100 text-red-600 rounded-lg shrink-0"><i class="ph ph-warning text-xl"></i></div>
                            <div>
                                <h4 class="font-bold text-ink mb-1">Morning Classes Tardiness Spike</h4>
                                <p class="text-sm text-text-muted">The AI engine detected a 5% increase in tardiness for 8:00 AM classes over the last two weeks, specifically correlating with heavy traffic reports on SLEX.</p>
                            </div>
                        </div>
                        <div class="bg-card p-6 rounded-xl border border-custom card-shadow flex items-start gap-4">
                            <div class="p-3 bg-green-100 text-green-600 rounded-lg shrink-0"><i class="ph ph-trend-up text-xl"></i></div>
                            <div>
                                <h4 class="font-bold text-ink mb-1">Improved STEM Attendance</h4>
                                <p class="text-sm text-text-muted">STEM track attendance has improved by 2.4% since the implementation of the new Dynamic QR scanning method.</p>
                            </div>
                        </div>
                    </div>
                `;
            } else if (viewId === 'reports') {
                html = `
                    <div class="h-full flex flex-col items-center justify-center text-center">
                        <div class="bg-white p-12 rounded-2xl border border-custom card-shadow max-w-md w-full">
                            <i class="ph-duotone ph-file-pdf text-6xl text-brand mb-4"></i>
                            <h3 class="text-2xl font-bold text-ink brand-font mb-2">Executive Summary</h3>
                            <p class="text-text-muted text-sm mb-8">Generate a comprehensive PDF report including all attendance trends, AI insights, and threshold alerts for the current term.</p>
                            
                            <button class="w-full bg-brand hover-bg-brand text-white font-semibold py-3 px-6 rounded-xl transition-all shadow-lg shadow-brand/30 flex items-center justify-center gap-2">
                                <i class="ph-bold ph-download-simple"></i> Generate & Download PDF
                            </button>
                        </div>
                    </div>
                `;
            }
            viewContainer.innerHTML = html;
        }

        // Initialize inline keyframes for UI animations
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
        `;
        document.head.appendChild(style);

        // Boot
        renderSidebar();
        switchView('home');

    </script>
</body>
</html>
